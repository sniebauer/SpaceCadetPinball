name: Web Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            bin/SpaceCadetPinball.html
            bin/SpaceCadetPinball.js
            bin/SpaceCadetPinball.wasm
